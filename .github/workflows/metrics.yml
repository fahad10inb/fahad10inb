name: Metrics
on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # let you run it manually
  push:
    branches: ["main"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit the generated SVG
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fahad10inb
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Dubai
          config_order: base.header, base.activity, languages, isocalendar, habits, base.community

          # Language breakdown (donut)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size

          # Commit calendar — the premium-looking one, always loads
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Coding habits & activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
