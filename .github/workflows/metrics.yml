name: Metrics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: fahad10inb
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Dubai

          # Count org + collaborator repos, not just your own
          repositories_affiliations: owner, collaborator, organization_member

          # Languages — analyse real code, including private (needs repo scope)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size

          # Full-year commit calendar (the standout visual)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Concrete volume of code written
          plugin_lines: yes
          plugin_lines_sections: history, repositories
